# REJECTED OPTION, kept for the record (DD-01, electrical.md section 6): Delta BFB0524HH-F00
# (24 V, 2-wire + FG) on a low-side MOSFET add-on. Its minimum-spec unit is 10 % below the
# stock 4020 on the S7 duct. The add-on schematic is in the git history of electrical.md.
# EXAMPLE ONLY - not active. Review, then copy next to tuning.cfg as part_fan.cfg
# and add "[include part_fan.cfg]" as the LAST line of tuning.cfg.
# Rollback: remove that include line, FIRMWARE_RESTART, refit the stock fan.
#
# Wiring: FAN+ -> fan red; fan black -> MOSFET drain; MOSFET gate <- board PWM pin
# (pull-up + 5.1 V Zener on the add-on); MOSFET source -> GND. FG NOT connected.
#
# pin / enable_pin stay Pellcorp's. The add-on turns the MOSFET on when the PWM
# line is high, the same "high = run" a 4-wire fan sees, so the inversion on
# PB8 is unchanged. If electrical.md 4.2 showed the opposite polarity,
# add "pin: nozzle_mcu:PB8" here (without "!").
[fan]
# 100 Hz supply PWM: the fan coasts through the off-periods and its speed
# follows the duty. Avoid 1-10 kHz (coil whine). 0.002-0.005 only if the
# 100 Hz hum is objectionable and speed control still works (electrical.md (git history)).
cycle_time: 0.010
# The Delta starts at 14 V of 24 V; a low duty may not start a stopped
# blower, so give it 0.5 s at full power (ESTIMATED).
kick_start_time: 0.500
# ESTIMATED placeholder: tune it (electrical.md (git history)). Requests below this turn
# the fan off, which also affects Orca's 0-30 % ABS/ASA fan range.
off_below: 0.25
max_power: 1.0
# No tachometer: under supply PWM the FG output is only valid at 100 %, and its
# reference floats up when the MOSFET is off (electrical.md (git history)).
