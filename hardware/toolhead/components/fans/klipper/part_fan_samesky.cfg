# Part fan, CONDITIONAL UPGRADE only (DD-01): Same Sky CBM-5015BF-175-459-22 (12 V,
# 4-wire PWM + tach) behind a 24->12 V buck, one fan. Needs the Same Sky duct variant and
# a regenerated frame (cfd-report.md section 12.1).
# EXAMPLE ONLY - not active. Review, then copy next to tuning.cfg as part_fan.cfg
# and add "[include part_fan.cfg]" as the LAST line of tuning.cfg.
# Rollback: remove that include line, FIRMWARE_RESTART, refit the stock fan.
# Docs: hardware/toolhead/documentation/electrical.md (sections 2, 3, 4, 5).
#
# Wiring: FAN+/GND -> buck input; buck 12 V -> red; black -> GND;
# blue PWM -> board PWM pin; yellow tach -> FG/PB3, only if PB6 measured
# HIGH-side (electrical.md 4.5).
#
# pin / enable_pin stay Pellcorp's: the blue wire reads "high = run" like the
# stock fan, so the inversion on PB8 is unchanged; PB6 still powers the buck,
# so the fan is truly off at 0 %.
[fan]
# 500 Hz software PWM. The Same Sky PWM input is specified for 0.2-50 kHz,
# so the stock 100 Hz (0.010) is out of spec (research/03 12.2). 0.002 is the
# value Pellcorp already uses for the aux fan. If the nozzle MCU shows timing
# errors, use 0.004 (250 Hz, still in spec).
cycle_time: 0.002
# The buck needs a few ms to start after PB6 switches on, and a 5015 rotor has
# more inertia than the 4020: 0.2 s at full power (ESTIMATED).
kick_start_time: 0.200
# ESTIMATED placeholder: below about 10 % duty many PWM fans run at an
# undefined minimum speed or stop. Measure (electrical.md section 3) and update.
off_below: 0.10
# Full speed (one fan, 0.18 A max at 24 V through the buck: inside the proven 0.3 A).
max_power: 1.0
# Tach: only if PB6 is high-side (fan GND = true GND). Open collector,
# 2 pulses/rev (datasheet); MCU pull-up on (^). 7500 rpm +10 % -> poll < 1.82 ms.
#tachometer_pin: ^nozzle_mcu:PB3
#tachometer_ppr: 2
#tachometer_poll_interval: 0.0010
