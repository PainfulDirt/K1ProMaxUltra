# Part fan, variant [V-4020]: stock Creality 4020 blower (24 V, 4-wire PWM + tach),
# one fan or two in parallel (one logical fan, DD-05).
# EXAMPLE ONLY - not active. Review, then copy next to tuning.cfg as part_fan.cfg
# and add "[include part_fan.cfg]" as the LAST line of tuning.cfg.
# Rollback: remove that include line, FIRMWARE_RESTART.
# Docs: hardware/toolhead/documentation/electrical.md (sections 2, 4, 7).
#
# Two fans: only after electrical.md section 4.4 shows the PB6 switch can carry
# 0.6 A. Parallel the PWM wires, wire ONE fan's FG to PB3, FAN+/GND per fan.
#
# pin / enable_pin are Pellcorp's (fan_control.cfg) and are not repeated here:
#   pin: !nozzle_mcu:PB8        PWM wire, open-collector stage, inverted
#   enable_pin: nozzle_mcu:PB6  fan supply, on while the speed is above 0
[fan]
# 100 Hz software PWM: the stock value. Pellcorp chose it, and the MPC
# fan_ambient_transfer table was measured with it.
cycle_time: 0.010
# Klipper default, made explicit: 0.1 s at full power when starting or when
# the speed rises by more than 50 %.
kick_start_time: 0.100
# Klipper default (the stock fan is never switched off below some speed).
# Raise only if the fan stalls at low speeds (electrical.md 5.5).
off_below: 0.0
# full 24 V fan power
max_power: 1.0
# Tach (stock FG wire on PB3, pull-up on). Off in Pellcorp. Enable for
# commissioning; keep it only if a long print shows no nozzle_mcu timing
# errors. 12000 rpm +10 %, 2 pulses/rev -> poll < 1.14 ms.
#tachometer_pin: ^nozzle_mcu:PB3
#tachometer_ppr: 2
#tachometer_poll_interval: 0.0008
