# Tuning for the glass bed + Microprobe V2 (2026-09-28)
#
# Measured on this printer at 80C: when the bed thermistor first reads 80C the
# centre of the glass is 0.16mm low, then it rises 0.25mm over ~6.5 minutes
# before settling. Meshing straight away (stock behaviour) captures a bowl
# that has become a dome by the first layer. So START_PRINT now:
#   1. waits until the bed actually stops moving (_GLASS_SOAK)
#   2. re-homes Z on the hot bed
#   3. meshes, with the mesh zeroed at the Z home spot

[probe]
samples: 3
samples_result: median
# during meshing the typical spread is 0.005mm with single outliers up to
# ~0.04mm; the median of 3 already rejects one outlier, so don't retry on it
samples_tolerance: 0.04
samples_tolerance_retries: 3

[bed_mesh]
speed: 150
horizontal_move_z: 5
# where the probe sits when homing Z: nozzle 153,153 with x_offset -33
zero_reference_position: 120, 153
# probe reach: X max 306.5 - 33 offset = 273.5 (pellcorp default stops at 262).
# Klipper holds the edge value beyond the mesh and the bed keeps dropping to
# the right, so measure as far right as the probe can go
mesh_max: 273, 295

[gcode_macro _SAF_START_PRINT_BEFORE_BED_MESH]
gcode:
    _GLASS_SOAK
    {% set home_x = printer["gcode_macro _HOMING_PARAMS"].home_x %}
    {% set home_y = printer["gcode_macro _HOMING_PARAMS"].home_y %}
    G90
    G0 X{home_x} Y{home_y} F6000
    RESPOND TYPE=command MSG='Re-homing Z on the hot bed'
    G28 Z

[gcode_macro _GLASS_SOAK]
description: Wait until the glass bed stops moving under the print: probe the Z home spot and the corners of the print area until all readings settle
# set to False to skip the soak entirely
variable_enabled: True
# seconds between checks
variable_interval: 40
# mm; a point that moved less than this counts as settled
variable_threshold: 0.012
# consecutive settled checks required (all points)
variable_settled_needed: 2
# upper limit on checks (~18 minutes)
variable_max_checks: 18
gcode:
    {% set on = params.FORCE|default(0)|int == 1 or printer['output_pin Glass_Soak'].value > 0 %}
    {% if enabled and on %}
      {% set hp = printer["gcode_macro _HOMING_PARAMS"] %}
      {% set probe_cfg = printer.configfile.settings.probe %}
      {% set mesh_cfg = printer.configfile.settings.bed_mesh %}
      {% set xo = probe_cfg.x_offset %}
      {% set yo = probe_cfg.y_offset %}
      # probe-reachable area, in bed (probe) coordinates
      {% set px_min = mesh_cfg.mesh_min[0] %}
      {% set px_max = mesh_cfg.mesh_max[0] %}
      {% set py_min = mesh_cfg.mesh_min[1] %}
      {% set py_max = mesh_cfg.mesh_max[1] %}
      # watch the corners of what is being printed: the edges of the glass
      # (the back most of all) keep moving for 10+ minutes after the centre
      {% set pts = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
      {% if pts | length > 0 %}
        {% set x0 = [[pts | map(attribute=0) | min, px_min] | max, px_max] | min %}
        {% set x1 = [[pts | map(attribute=0) | max, px_min] | max, px_max] | min %}
        {% set y0 = [[pts | map(attribute=1) | min, py_min] | max, py_max] | min %}
        {% set y1 = [[pts | map(attribute=1) | max, py_min] | max, py_max] | min %}
      {% else %}
        {% set x0 = px_min + 15 %}
        {% set x1 = px_max - 15 %}
        {% set y0 = py_min + 10 %}
        {% set y1 = py_max - 10 %}
      {% endif %}
      # a small print needs no corners on that axis, just its middle
      {% set xs = [x0, x1] if x1 - x0 >= 40 else [(x0 + x1) / 2] %}
      {% set ys = [y0, y1] if y1 - y0 >= 40 else [(y0 + y1) / 2] %}
      # nozzle positions: the Z home spot first (Z home + nozzle touch happen there)
      {% set ns = namespace(points=[[hp.home_x, hp.home_y]]) %}
      {% for y in ys %}
        {% for x in xs %}
          {% set ns.points = ns.points + [[(x - xo) | round(1), (y - yo) | round(1)]] %}
        {% endfor %}
      {% endfor %}
      {% set points = ns.points %}
      SET_GCODE_VARIABLE MACRO=_GLASS_SOAK_STEP VARIABLE=points VALUE="{points}"
      SET_GCODE_VARIABLE MACRO=_GLASS_SOAK_STEP VARIABLE=last VALUE="[]"
      SET_GCODE_VARIABLE MACRO=_GLASS_SOAK_STEP VARIABLE=current VALUE="[]"
      SET_GCODE_VARIABLE MACRO=_GLASS_SOAK_STEP VARIABLE=settled VALUE=0
      SET_GCODE_VARIABLE MACRO=_GLASS_SOAK_STEP VARIABLE=done VALUE=False
      RESPOND TYPE=command MSG="Glass soak: watching {points | length} spots - the Z home spot and the print area X{'%.0f' % x0}-{'%.0f' % x1} Y{'%.0f' % y0}-{'%.0f' % y1}"
      G90
      G0 Z5 F1200
      # klipper macros cannot loop on a live value, so run a fixed number of
      # steps and have each one become a no-op once the bed has settled
      {% for i in range(max_checks) %}
        _GLASS_SOAK_STEP N={i + 1}
      {% endfor %}
      # separate macro so it sees the final state
      _GLASS_SOAK_REPORT
    {% else %}
      RESPOND TYPE=command MSG='Glass soak: switched off'
    {% endif %}

[gcode_macro _GLASS_SOAK_STEP]
variable_points: []
variable_last: []
variable_current: []
variable_settled: 0
variable_done: False
gcode:
    {% set soak = printer["gcode_macro _GLASS_SOAK"] %}
    {% if not done %}
      {% if last | length > 0 %}
        G4 P{(soak.interval * 1000)|int}
      {% endif %}
      SET_GCODE_VARIABLE MACRO=_GLASS_SOAK_STEP VARIABLE=current VALUE="[]"
      {% for p in points %}
        G0 X{p[0]} Y{p[1]} F12000
        PROBE SAMPLES=3 SAMPLES_RESULT=median
        G0 Z5 F1200
        # separate macro so it is rendered after PROBE has finished
        _GLASS_SOAK_RECORD
      {% endfor %}
      _GLASS_SOAK_EVAL N={params.N}
    {% endif %}

[gcode_macro _GLASS_SOAK_RECORD]
gcode:
    {% set cur = printer["gcode_macro _GLASS_SOAK_STEP"].current + [printer.probe.last_z_result] %}
    SET_GCODE_VARIABLE MACRO=_GLASS_SOAK_STEP VARIABLE=current VALUE="{cur}"

[gcode_macro _GLASS_SOAK_EVAL]
gcode:
    {% set soak = printer["gcode_macro _GLASS_SOAK"] %}
    {% set step = printer["gcode_macro _GLASS_SOAK_STEP"] %}
    {% set cur = step.current %}
    {% if step.last | length == cur | length %}
      {% set ns = namespace(worst=0.0) %}
      {% for i in range(cur | length) %}
        {% set d = (cur[i] - step.last[i]) | abs %}
        {% if d > ns.worst %}{% set ns.worst = d %}{% endif %}
      {% endfor %}
      {% set worst = ns.worst %}
      {% set settled = step.settled + 1 if worst <= soak.threshold else 0 %}
    {% else %}
      {% set worst = 0.0 %}
      {% set settled = 0 %}
    {% endif %}
    RESPOND TYPE=command MSG="Glass soak {params.N}/{soak.max_checks}: {cur | map('round', 4) | join(', ')} - largest change {'%.4f' % worst}, bed {'%.1f' % printer.heater_bed.temperature}C"
    SET_GCODE_VARIABLE MACRO=_GLASS_SOAK_STEP VARIABLE=last VALUE="{cur}"
    SET_GCODE_VARIABLE MACRO=_GLASS_SOAK_STEP VARIABLE=settled VALUE={settled}
    {% if settled >= soak.settled_needed %}
      SET_GCODE_VARIABLE MACRO=_GLASS_SOAK_STEP VARIABLE=done VALUE=True
    {% endif %}

[gcode_macro _GLASS_SOAK_REPORT]
gcode:
    {% if printer["gcode_macro _GLASS_SOAK_STEP"].done %}
      RESPOND TYPE=command MSG='Glass soak: bed settled'
    {% else %}
      RESPOND TYPE=command MSG='Glass soak: time limit reached before the bed settled, continuing anyway'
    {% endif %}

# --- Load cells (4x HX711 on the leveling board) ---------------------------
# Needs pellcorp/kalico aug2026 + bed0_121 firmware. Config from pellcorp's
# own K1 (pellcorp/creality#1500). The Microprobe stays the primary probe for
# Z homing and meshing; the load cells only set true Z=0 by nozzle contact.

[mcu leveling_mcu]
serial: /dev/ttyS9
baud: 230400
restart_method: command

[load_cell_probe]
sensor_type: hx711s
dout_pins: leveling_mcu:PA4, leveling_mcu:PA3, leveling_mcu:PA0, leveling_mcu:PA1
sclk_pins: leveling_mcu:PA7, leveling_mcu:PA6, leveling_mcu:PA2, leveling_mcu:PA5
sensor_orientation: inverted
sample_rate: 80
gain: A-128
trigger_force: 160
force_safety_limit: 2000
drift_safety_limit: 1000
speed: 1.0
lift_speed: 10.0
# contact counts as Z=-0.02, i.e. the nozzle prints 0.02mm higher than true
# contact; set from the full-bed first layer test (0.0 was a bit too squished)
z_offset: -0.02
pullback_speed: 1.0
pullback_distance: 0.5
sample_retract_dist: 0.5
samples_tolerance: 0.05
samples_tolerance_retries: 3
tap_classifier: tap_quality
register_as_probe: False
# not weighed on this printer: counts_per_gram is pellcorp's K1 value (same
# load cells), so forces in grams are approximate. The touch height does not
# depend on it.
counts_per_gram: 112.23774
# measured on this printer with the bed empty
reference_tare_counts: 1048482

[gcode_macro _SAF_START_PRINT_AFTER_BED_MESH]
gcode:
    _LOAD_CELL_TOUCH_Z

[gcode_macro _LOAD_CELL_TOUCH_Z]
description: Wipe the nozzle, touch it on the bed at the mesh zero reference and make that contact Z=0
variable_enabled: True
# keep the nozzle cool enough not to mark the bed coating
variable_touch_temp: 150
# BED_MESH_EXTEND after the touch is switched by the Mesh_Extend output pin
# (default off: tested 2026-09-29, beyond X273 this bed stays within ~0.02mm of
# the X273 edge value, so the flat hold is about as good and saves 2-3 minutes)
# accepted difference to the Microprobe (mm). Ooze on the nozzle makes it
# touch early, which reads negative, so that side is kept tight. Positive is
# a real offset: hot (bed 80C, nozzle 150C) this printer measures ~+0.07.
variable_min_difference: -0.03
variable_max_difference: 0.15
gcode:
    {% set on = params.FORCE|default(0)|int == 1 or printer['output_pin Nozzle_Touch'].value > 0 %}
    {% if enabled and on %}
      {% set ref = printer.configfile.settings.bed_mesh.zero_reference_position %}
      {% set probe_cfg = printer.configfile.settings.probe %}
      {% set bed_target = printer.heater_bed.target %}
      M109 S{touch_temp}
      {% if printer['output_pin Nozzle_Wipe'].value > 0 %}
        _TOUCH_NOZZLE_WIPE
      {% endif %}
      # the bed heater switching adds noise to the load cells
      M140 S0
      G90
      G0 Z5 F900
      G0 X{ref[0]} Y{ref[1]} F6000
      RESPOND TYPE=command MSG='Load cell: touching nozzle to set Z=0'
      LOAD_CELL_PROBE HOME=Z
      G0 Z5 F900
      # check the new Z=0 with the Microprobe on the same spot of the bed
      G0 X{ref[0] - probe_cfg.x_offset} Y{ref[1] - probe_cfg.y_offset} F6000
      PROBE SAMPLES=3 SAMPLES_RESULT=median
      G0 Z5 F900
      # separate macro so it is rendered after PROBE has finished
      _LOAD_CELL_TOUCH_CHECK
      M140 S{bed_target}
      M190 S{bed_target}
      {% if printer['output_pin Mesh_Extend'].value > 0 %}
        # carry the mesh past the Microprobe's reach (X273) with nozzle taps
        # when the print goes there; does nothing otherwise
        BED_MESH_EXTEND
      {% endif %}
    {% else %}
      RESPOND TYPE=command MSG='Load cell: nozzle touch switched off, using Microprobe Z'
    {% endif %}

[gcode_macro _LOAD_CELL_TOUCH_CHECK]
gcode:
    {% set touch = printer["gcode_macro _LOAD_CELL_TOUCH_Z"] %}
    # after a clean touch the Microprobe triggers at its z_offset plus any
    # real offset error; ooze on the nozzle touches early and reads negative
    # the load cell's own z_offset shifts the new frame; take it out again
    {% set lc_offset = printer.configfile.settings.load_cell_probe.z_offset %}
    {% set diff = printer.probe.last_z_result - printer.configfile.settings.probe.z_offset - lc_offset %}
    {% if diff < touch.min_difference %}
      RESPOND TYPE=command MSG="Load cell: touch is {'%+.3f' % diff}mm off the Microprobe (dirty nozzle?), using Microprobe Z instead"
    {% elif diff > touch.max_difference %}
      RESPOND TYPE=command MSG="Load cell: touch is {'%+.3f' % diff}mm off the Microprobe (more than expected), using Microprobe Z instead"
    {% else %}
      RESPOND TYPE=command MSG="Load cell: Z=0 set by nozzle touch ({'%+.3f' % diff}mm vs Microprobe)"
    {% endif %}
    {% if diff < touch.min_difference or diff > touch.max_difference %}
      G90
      G0 X{printer["gcode_macro _HOMING_PARAMS"].home_x} Y{printer["gcode_macro _HOMING_PARAMS"].home_y} F6000
      G28 Z
    {% endif %}

[gcode_macro _TOUCH_NOZZLE_WIPE]
description: Clean the nozzle on the rear edge of the bed before the load cell touch (stock method): hot scrub, cool down pressed into the PEI, slow rising drag that leaves the residue on the bed
# a strip behind the print area; probed flat and continuous on this bed
variable_y: 298
variable_x_start: 110
variable_x_end: 170
# press into the PEI sheet like the stock firmware (pa_clr_down_mm: -0.15)
variable_z: -0.15
# hot scrub: residue is runny and smears instead of stringing
variable_wipe_temp: 200
variable_scrub_passes: 2
# mm/s; slow, so the hot residue smears onto the PEI instead of being skipped
variable_scrub_speed: 15
# each scrub pass and the drag move this far in Y, onto clean PEI
variable_y_step: 0.6
# cool to this while pressed into the PEI so the residue sets there
variable_drag_temp: 160
# mm/s; slow drag with Z rising: the set residue stays on the bed and peels
# off the tip (the stock routine is this slow too)
variable_drag_speed: 2
variable_drag_rise: 0.4
gcode:
    {% set touch_temp = printer["gcode_macro _LOAD_CELL_TOUCH_Z"].touch_temp %}
    {% set y0 = y - scrub_passes * y_step / 2 %}
    G90
    G0 Z5 F900
    G0 X{x_start} Y{y0} F6000
    M109 S{wipe_temp}
    G1 Z{z} F300
    # hot scrub, one direction per pass, each pass on a fresh line
    {% for i in range(scrub_passes) %}
      G1 X{x_end if i is even else x_start} Y{y0 + i * y_step} F{scrub_speed * 60}
    {% endfor %}
    {% set x_here = x_end if (scrub_passes - 1) is even else x_start %}
    {% set x_other = x_start if x_here == x_end else x_end %}
    # step onto a fresh line and stay pressed while the fan cools the nozzle
    G1 Y{y0 + scrub_passes * y_step} F600
    M104 S{touch_temp}
    M106 S255
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={drag_temp}
    # slow drag while rising: the residue stuck to the PEI pulls off the tip
    G1 X{x_other} Z{z + drag_rise} F{drag_speed * 60}
    # lift away towards the back edge, away from the print area
    G1 X{x_other + (15 if x_other == x_end else -15)} Y{[y + 6, 304] | min} Z2 F6000
    G0 Z5 F900
    M106 S0
    M109 S{touch_temp}

[axis_twist_compensation]
z_compensations: 0.038761, -0.019187, -0.008176, -0.010624, 0.024967, 0.005910, -0.031651
compensation_start_x: 43
compensation_end_x: 306

# --- Hotend MPC (Kalico) instead of PID -----------------------------------
# PID before the switch (bed 80 retune, hotend at 250C): Kp=25.278 Ki=2.055
# Kd=77.729. The model constants are measured by MPC_CALIBRATE and stored in
# the SAVE_CONFIG block of printer.cfg.
[extruder]
# K1 series 60W ceramic heater
heater_power: 60
cooling_fan: fan
# PETG (most prints here); PLA is 1.25 / 1.8 and makes little difference
filament_density: 1.27
filament_heat_capacity: 1.8

# --- Belt test: Kalico names the data files raw_data_..._adxl345_A.csv, the
# Pellcorp macro still looks for the old names, so its graph step fails.
[gcode_macro BELTS_SHAPER_CALIBRATION]
description: Perform a custom half-axis test to analyze and compare the frequency profiles of individual belts on CoreXY printers
gcode:
  {% if printer.print_stats.state != "printing" %}
    {% if 'resonance_tester' in printer.configfile.settings %}
      {% set min_freq = params.FREQ_START|default(5)|float %}
      {% set max_freq = params.FREQ_END|default(133.33)|float %}
      {% set hz_per_sec = params.HZ_PER_SEC|default(1)|float %}
      {% set png_out_path = params.PNG_OUT_PATH|default("/usr/data/printer_data/config/images/belts_calibration.png") %}
      {% set png_width = params.PNG_WIDTH|default(8)|float %}
      {% set png_height = params.PNG_HEIGHT|default(4.8)|float %}

      TEST_RESONANCES AXIS=1,1 OUTPUT=raw_data NAME=B FREQ_START={min_freq} FREQ_END={max_freq} HZ_PER_SEC={hz_per_sec}
      M400

      TEST_RESONANCES AXIS=1,-1 OUTPUT=raw_data NAME=A FREQ_START={min_freq} FREQ_END={max_freq} HZ_PER_SEC={hz_per_sec}
      M400

      RESPOND MSG="Belts comparative frequency profile generation..."
      RESPOND MSG="This may take some time (3-5min)"
      RUN_SHELL_COMMAND CMD=graph_belts PARAMS="-w {png_width} -l {png_height} -n -o {png_out_path} -k /usr/data/klipper /usr/data/tmp/raw_data_axis=1.000,-1.000_adxl345_A.csv /usr/data/tmp/raw_data_axis=1.000,1.000_adxl345_B.csv"
    {% else %}
      RESPOND TYPE=error MSG='Resonance tester configuration missing!'
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='Not available while printing'
  {% endif %}



# --- Mesh extension to the right bed edge (custom/mesh_edge_extend.py) -------
# The Microprobe's 33mm X offset stops the mesh at X273. When a print goes
# further right, BED_MESH_EXTEND taps the nozzle (load cells) at X273 and near
# the bed edge on 5 rows and extends the mesh to X300 with the measured slope.
[mesh_edge_extend]
edge_x: 296
max_x: 300
rows: 5
# median of 3 taps per spot: +-0.004mm (single taps +-0.005-0.006mm)
samples: 3

# --- Update check / update (custom/check-updates.sh, custom/update.sh) -------
[gcode_shell_command k1_check_updates]
command: /usr/data/pellcorp-overrides/custom/check-updates.sh
timeout: 120
verbose: True

[gcode_shell_command k1_update]
command: /usr/data/pellcorp-overrides/custom/update.sh
timeout: 30
verbose: True

[gcode_macro PRINTER_CHECK_UPDATES]
description: Check Pellcorp and Kalico for updates (result in UPDATES.md)
gcode:
    RUN_SHELL_COMMAND CMD=k1_check_updates

[gcode_macro PRINTER_UPDATE_PELLCORP]
description: Save your changes (pushed to GitHub), then update Pellcorp Simple AF
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
      RESPOND TYPE=error MSG='Not available while printing'
    {% else %}
      RUN_SHELL_COMMAND CMD=k1_update PARAMS="--bg pellcorp"
    {% endif %}

[gcode_macro PRINTER_UPDATE_KALICO]
description: Save your changes (pushed to GitHub), then update Kalico (may need a power cycle for new MCU firmware)
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
      RESPOND TYPE=error MSG='Not available while printing'
    {% else %}
      RUN_SHELL_COMMAND CMD=k1_update PARAMS="--bg kalico"
    {% endif %}

# --- Switches and buttons -----------------------------------------------------
# Switches: Fluidd -> Outputs panel. They only control what START_PRINT does and
# are remembered across restarts (variables.cfg). Buttons: Fluidd -> Macros;
# they always run, whatever the switches say.
[save_variables]
filename: /usr/data/printer_data/config/variables.cfg

[output_pin Glass_Soak]
pin: virtual_pin:glass_soak_pin
value: 1

[output_pin Nozzle_Wipe]
pin: virtual_pin:nozzle_wipe_pin
value: 1

[output_pin Nozzle_Touch]
pin: virtual_pin:nozzle_touch_pin
value: 1

[output_pin Mesh_Extend]
pin: virtual_pin:mesh_extend_pin
value: 0

[gcode_macro _SWITCHES]
# output pin name -> saved variable name
variable_map: {"Glass_Soak": "sw_glass_soak", "Nozzle_Wipe": "sw_nozzle_wipe", "Nozzle_Touch": "sw_nozzle_touch", "Mesh_Extend": "sw_mesh_extend"}
gcode:

[delayed_gcode _SWITCHES_RESTORE]
initial_duration: 1
gcode:
    {% set saved = printer.save_variables.variables %}
    {% for pin, var in printer["gcode_macro _SWITCHES"].map.items() %}
      {% if var in saved %}
        SET_PIN PIN={pin} VALUE={saved[var]}
      {% endif %}
    {% endfor %}
    UPDATE_DELAYED_GCODE ID=_SWITCHES_SAVE DURATION=5

# Fluidd toggles call SET_PIN directly, so save whatever changed every few seconds
[delayed_gcode _SWITCHES_SAVE]
gcode:
    {% set saved = printer.save_variables.variables %}
    {% for pin, var in printer["gcode_macro _SWITCHES"].map.items() %}
      {% set now = printer["output_pin " ~ pin].value | int %}
      {% if saved[var] | default(-1) | int != now %}
        SAVE_VARIABLE VARIABLE={var} VALUE={now}
      {% endif %}
    {% endfor %}
    UPDATE_DELAYED_GCODE ID=_SWITCHES_SAVE DURATION=5

[gcode_macro GLASS_SOAK]
description: Heat the bed (BED_TEMP, default the current target or 70) and wait until the glass stops moving
gcode:
    {% set target = printer.heater_bed.target if printer.heater_bed.target > 0 else 70 %}
    {% set bed = params.BED_TEMP|default(target)|float %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    M190 S{bed}
    _GLASS_SOAK FORCE=1

[gcode_macro NOZZLE_CLEAN]
description: Clean the nozzle on the rear edge of the bed (hot scrub, cool down pressed into the PEI, slow rising drag)
gcode:
    {% set before = printer.extruder.target %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    _TOUCH_NOZZLE_WIPE
    M104 S{before}
    G90
    G0 Z20 F900

[gcode_macro NOZZLE_TOUCH_Z]
description: Clean the nozzle, then touch it on the bed with the load cells and make that contact Z=0
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    _LOAD_CELL_TOUCH_Z FORCE=1
    G90
    G0 Z20 F900

[gcode_macro MESH_EDGE_EXTEND]
description: Extend the active bed mesh to the right bed edge (X300) with nozzle taps
gcode:
    {% if printer.bed_mesh.profile_name == "" %}
      RESPOND TYPE=error MSG='No bed mesh loaded - run BED_MESH_CALIBRATE first'
    {% else %}
      BED_MESH_EXTEND FORCE=1
    {% endif %}

[gcode_macro BACKUP_TO_GITHUB]
description: Save the config overrides and push them to github.com/PainfulDirt/K1ProMaxUltra
gcode:
    CONFIG_OVERRIDES
